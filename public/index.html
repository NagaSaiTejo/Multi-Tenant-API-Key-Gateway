<!DOCTYPE strict>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Gateway Console</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                <h2>Gateway</h2>
            </div>
            <nav>
                <a href="#" class="nav-item active">Dashboard</a>
                <a href="#" class="nav-item">Settings</a>
            </nav>
            <div class="tenant-info">
                <span>Tenant ID: <strong>1</strong></span>
            </div>
        </aside>

        <main class="main-content">
            <header>
                <h1>API Keys</h1>
                <button class="btn-primary" id="btn-create-key">+ Create New Key</button>
            </header>

            <section class="metrics-section">
                <div class="card chart-card">
                    <h3>Usage Volume (Last Hour)</h3>
                    <div class="chart-container">
                        <canvas id="usageChart"></canvas>
                    </div>
                </div>
            </section>

            <section class="keys-section">
                <div class="card">
                    <h3>Active API Keys</h3>
                    <div class="table-container">
                        <table id="keys-table">
                            <thead>
                                <tr>
                                    <th>Key</th>
                                    <th>Created At</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Keys will be rendered here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section class="logs-section">
                <div class="card">
                    <h3>Audit Logs</h3>
                    <div class="table-container">
                        <table id="logs-table">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Key</th>
                                    <th>Endpoint</th>
                                    <th>Status Code</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Logs will be rendered here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal for new key -->
    <div id="key-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>New API Key Generated</h2>
            <p>Please copy this key now. You will not be able to see it again.</p>
            <div class="key-display-box">
                <code id="new-key-value"></code>
            </div>
            <button class="btn-secondary" id="btn-modal-close">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
